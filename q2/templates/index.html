<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face ↔ Sketch</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Face ↔ Sketch (CycleGAN)</h1>

    <section class="controls">
      <label>Upload image <input id="file" type="file" accept="image/*"></label>
      <button id="camera" type="button">Start camera</button>
      <button id="snap" type="button" disabled>Capture</button>
      <label><input id="live" type="checkbox" disabled> Live</label>
      <label>Direction
        <select id="mode">
          <option value="auto">Auto-detect</option>
          <option value="photo2sketch">Photo → Sketch</option>
          <option value="sketch2photo">Sketch → Photo</option>
        </select>
      </label>
    </section>

    <p id="status" role="status" aria-live="polite">Upload a face photo or a sketch.</p>

    <section class="panes">
      <figure>
        <video id="video" autoplay playsinline muted hidden></video>
        <img id="input" alt="Input image" hidden>
        <figcaption id="input-label">Input</figcaption>
      </figure>
      <figure>
        <img id="output" alt="Converted image" hidden>
        <figcaption id="output-label">Output</figcaption>
      </figure>
    </section>
    <canvas id="canvas" hidden></canvas>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
